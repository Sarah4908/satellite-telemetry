# default to local instances; docker-compose overrides via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telemetry}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Fixed: Asia/Kolkata is the correct IANA name (Asia/Calcutta is deprecated and rejected by PostgreSQL 15)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

server.port=8080

# ML service URL — overridden by docker-compose via ML_SERVICE_URL env var
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
